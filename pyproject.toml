[project]
name = "trainfoundry"
version = "0.1.0"
description = "A reproducible multimodal training-data and AI infrastructure playground."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.0",
    "huggingface-hub>=0.36",
    "minari[hdf5]>=0.5",
    "pillow>=11.0",
    "pyarrow>=25.0.0",
    "pylance>=9.0.0",
]

[project.scripts]
trainfoundry = "trainfoundry.cli:main"
tf = "trainfoundry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trainfoundry", "fetch", "config", "metadata", "pipeline"]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]
